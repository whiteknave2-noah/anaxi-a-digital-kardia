[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-harness"
version = "0.1.0"
description = "Bind a project's claims to executed evidence and account for them truthfully."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
claim-harness = "claim_harness.cli:main"

[tool.setuptools]
packages = ["claim_harness"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/toy_agent/tests"]
pythonpath = ["examples/toy_agent"]
markers = ["slow: spawns and kills a subprocess; deselected in the quick reference run"]
